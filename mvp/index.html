<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Styler Store MVP</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a print-shop catalogue on white "paper", with a CMYK colour bar as the signature; storefront and manager dashboard share one shell. */
:root{
  --paper:#f7f7f4; --surface:#ffffff; --ink:#16171b; --muted:#5c6170; --line:#e3e3dd;
  --cyan:#0093cf; --magenta:#d6006f; --yellow:#f5c400; --key:#16171b;
  --ok:#1d7f46; --warn:#9a5d00; --bad:#b42323;
  --on-ink:#ffffff;
  --font-display:'Readex Pro', 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --font-body:'IBM Plex Sans Arabic', 'Readex Pro', system-ui, sans-serif;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111216; --surface:#1a1c22; --ink:#f0f0ec; --muted:#a2a7b4; --line:#2d3039;
    --cyan:#3fc0f2; --magenta:#ff58ad; --yellow:#ffd84a; --key:#f0f0ec;
    --ok:#4cc583; --warn:#f0a840; --bad:#ff6b6b; --on-ink:#111216;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111216; --surface:#1a1c22; --ink:#f0f0ec; --muted:#a2a7b4; --line:#2d3039;
  --cyan:#3fc0f2; --magenta:#ff58ad; --yellow:#ffd84a; --key:#f0f0ec;
  --ok:#4cc583; --warn:#f0a840; --bad:#ff6b6b; --on-ink:#111216;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6}
h1,h2,h3{font-family:var(--font-display);line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,4vw,2.4rem)} h2{font-size:1.35rem} h3{font-size:1.05rem}
img{max-width:100%;display:block}
a{color:var(--cyan)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* demo strip + header */
.demo{background:var(--ink);color:var(--on-ink);font-size:.82rem;text-align:center;padding:6px 16px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-inline-end:auto}
.brand b{font-family:var(--font-display);font-size:1.2rem;letter-spacing:.2px}
.brand span{display:block;font-size:.72rem;color:var(--muted);margin-top:-4px}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cmyk{display:grid;grid-template-columns:repeat(4,1fr);height:5px}
.cmyk i:nth-child(1){background:var(--cyan)} .cmyk i:nth-child(2){background:var(--magenta)}
.cmyk i:nth-child(3){background:var(--yellow)} .cmyk i:nth-child(4){background:var(--key)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:8px 16px;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.primary:hover{opacity:.88}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:5px 12px;font-size:.875rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--magenta);color:#fff;font-size:.75rem;font-weight:600}

/* hero */
.hero{padding:28px 0 8px;display:grid;gap:10px}
.hero p{margin:0;max-width:62ch;color:var(--muted)}
.tech{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tech span{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--surface)}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:16px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.search{flex:1 1 220px;max-width:320px;margin-inline-start:auto}
input[type=text],input[type=tel],input[type=number],input[type=search],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
textarea{min-height:84px;resize:vertical}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding-bottom:40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit}
.card:hover{border-color:var(--ink)}
.card .img{aspect-ratio:4/3;background:var(--paper);overflow:hidden}
.card .img img{width:100%;height:100%;object-fit:cover}
.card .body{padding:12px 14px 14px;display:grid;gap:4px;flex:1}
.card .cat{font-size:.75rem;color:var(--muted)}
.card .price{margin-top:auto;font-weight:600;color:var(--magenta)}
.card .quote{margin-top:auto;font-weight:600;color:var(--cyan)}
.tag{display:inline-block;font-size:.72rem;border-radius:999px;padding:1px 8px;background:color-mix(in srgb,var(--yellow) 30%,transparent);color:var(--ink);width:max-content}

/* product page */
.pp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;padding:24px 0 48px}
.pp .gallery{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;align-self:start}
.pp .gallery img{width:100%;aspect-ratio:4/3;object-fit:cover}
.pp form{display:grid;gap:18px}
.field{display:grid;gap:6px}
.field>label,.field>.lbl,legend{font-weight:600;font-size:.92rem}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);min-width:64px;text-align:center;cursor:pointer}
.opt span em{font-style:normal;color:var(--magenta);font-weight:600;font-size:.9rem}
.opt input:checked+span{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt input:focus-visible+span{outline:3px solid var(--cyan);outline-offset:2px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;display:flex;gap:12px;align-items:center;background:var(--surface)}
.drop img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.note{border-inline-start:3px solid var(--cyan);background:var(--surface);padding:10px 14px;border-radius:8px;font-size:.9rem}
.note.y{border-color:var(--yellow)} .note.m{border-color:var(--magenta)}
.back{display:inline-flex;margin-top:18px}
.stepper{display:inline-flex;justify-self:start;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.stepper button{border:0;background:transparent;width:34px;height:34px;cursor:pointer;font-size:1.1rem}
.stepper input{width:44px;border:0;text-align:center;padding:4px;background:transparent}

/* cart + checkout */
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;padding:24px 0 48px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.line{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.line:last-child{border-bottom:0}
.line img{width:72px;height:54px;object-fit:cover;border-radius:8px;background:var(--paper)}
.line .meta{font-size:.85rem;color:var(--muted)}
.line .end{display:grid;gap:8px;justify-items:end}
.sum{display:grid;gap:8px}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .total{font-weight:700;font-size:1.15rem;border-top:1px solid var(--line);padding-top:10px}
.form{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--bad);font-size:.85rem}
.empty{padding:48px 16px;text-align:center;display:grid;gap:12px;justify-items:center}
.done{max-width:640px;margin:32px auto 56px;display:grid;gap:16px;text-align:center;justify-items:center}
.done .code{font-family:var(--font-display);font-size:2rem;letter-spacing:1px}

/* admin */
.atabs{display:flex;gap:6px;flex-wrap:wrap;padding:18px 0 4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:12px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;border-top:4px solid var(--line)}
.tile b{display:block;font-family:var(--font-display);font-size:1.6rem}
.tile span{font-size:.85rem;color:var(--muted)}
.tile.c{border-top-color:var(--cyan)} .tile.m{border-top-color:var(--magenta)} .tile.y{border-top-color:var(--yellow)} .tile.k{border-top-color:var(--key)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.8rem}
tbody tr{cursor:pointer}
tbody tr:hover{background:color-mix(in srgb,var(--cyan) 6%,transparent)}
tbody tr:last-child td{border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-new{color:var(--magenta);background:color-mix(in srgb,var(--magenta) 12%,transparent)}
.st-confirmed{color:var(--cyan);background:color-mix(in srgb,var(--cyan) 12%,transparent)}
.st-designing,.st-printing{color:var(--warn);background:color-mix(in srgb,var(--yellow) 22%,transparent)}
.st-shipping{color:var(--cyan);background:color-mix(in srgb,var(--cyan) 18%,transparent)}
.st-delivered{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.st-cancelled{color:var(--muted);background:color-mix(in srgb,var(--muted) 14%,transparent)}
.plist{display:grid;gap:10px;padding-bottom:40px}
.prow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.prow img{width:64px;height:48px;object-fit:cover;border-radius:8px}
.prow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:end}
.prow.off{opacity:.55}
.mode{font-size:.75rem;border-radius:999px;padding:1px 8px;border:1px solid var(--line)}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem}
.steps button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.tierrow{display:grid;grid-template-columns:1fr 1fr 1.4fr 1.4fr auto;gap:8px;align-items:center}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.checks label{display:flex;gap:6px;align-items:center;font-weight:400}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,10,14,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal .box{background:var(--surface);border-radius:16px;width:min(760px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:grid;gap:16px;border:1px solid var(--line)}
.modal .head{display:flex;justify-content:space-between;align-items:center;gap:12px}
#toast{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--on-ink);padding:10px 18px;border-radius:999px;z-index:60;font-size:.92rem;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:none}
.logo{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none}
footer{background:var(--surface);border-top:1px solid var(--line);padding:32px 0 20px;font-size:.92rem;scroll-margin-top:80px}
.fgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:28px}
.fgrid h3{font-size:.95rem;margin-bottom:10px}
.fbrand{display:flex;gap:12px;align-items:flex-start}
.fbrand .logo{width:56px;height:56px}
.fbrand p{margin:6px 0 0;color:var(--muted);max-width:42ch}
.flinks{display:grid;gap:8px}
.flinks a{display:inline-flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;width:max-content}
.flinks a:hover{color:var(--cyan)}
.flinks svg{width:20px;height:20px;flex:none}
.flist{margin:0;padding:0;list-style:none;display:grid;gap:6px;color:var(--muted)}
.flist li::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--magenta);margin-inline-end:8px;vertical-align:middle}
.fbottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:24px;padding-top:14px;color:var(--muted);font-size:.82rem}
.fbottom a{color:var(--muted)}
/* colours */
.opt.col span{display:flex;align-items:center;gap:8px}
.sw{width:16px;height:16px;border-radius:50%;border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);flex:none;display:inline-block}
.colrow{display:grid;grid-template-columns:48px 1fr 1fr auto;gap:8px;align-items:center}
.colrow input[type=color]{width:48px;height:40px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
/* admin categories */
.sub-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0 10px}
.catlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.catrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;border-inline-start:5px solid var(--cc,var(--cyan))}
.catrow div{flex:1;min-width:0}
.catrow b{display:block}
.palette{display:flex;gap:8px}
.palette label{position:relative}
.palette input{position:absolute;opacity:0;inset:0;cursor:pointer}
.palette span{display:block;width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.palette input:checked+span{box-shadow:0 0 0 2px var(--ink)}
.palette input:focus-visible+span{outline:3px solid var(--cyan);outline-offset:2px}

/* theme toggle */
.iconbtn{width:36px;height:36px;padding:0;border-radius:50%}
.iconbtn svg{width:18px;height:18px}

/* category home */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding:16px 0 40px}
.catcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;color:inherit;display:grid;grid-template-rows:auto 1fr}
.catcard:hover{border-color:var(--ink)}
.catcard .img{aspect-ratio:16/9;overflow:hidden;background:var(--paper)}
.catcard .img img{width:100%;height:100%;object-fit:cover}
.catcard .body{padding:14px 16px 16px;display:grid;gap:6px;border-top:4px solid var(--cc,var(--cyan))}
.catcard .meta{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;color:var(--muted)}
.catcard .go{color:var(--ink);font-weight:600}
.allcard{display:grid;place-items:center;text-align:center;padding:24px;border-style:dashed;min-height:180px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;padding-top:20px;flex-wrap:wrap}

/* products page with filter sidebar */
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;padding:20px 0 40px;align-items:start}
.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:18px;position:sticky;top:84px}
.side h3{font-size:.95rem}
.side .grp{display:grid;gap:8px}
.side .range{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side .radios{display:grid;gap:6px}
.side .radios label,.side .checks label{display:flex;gap:8px;align-items:center;font-size:.92rem;cursor:pointer}
.side .checks{display:grid;gap:6px}
.side .hint{font-size:.78rem;color:var(--muted)}
.listhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.listhead .count{color:var(--muted);font-size:.9rem;margin-inline-end:auto}
.listhead select{width:auto}
.activef{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.activef button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.82rem;cursor:pointer}
.activef button::after{content:" ×";color:var(--muted)}
.filtersToggle{display:none}
.layout .grid{padding-bottom:0}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{position:static;display:none}
  .side.open{display:grid}
  .filtersToggle{display:inline-flex}
  .pp,.two{grid-template-columns:1fr}
  .tierrow{grid-template-columns:1fr 1fr;}
  .fgrid{grid-template-columns:1fr}
}
@media (max-width:600px){
  .cats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-top:12px}
  .catcard .img{aspect-ratio:4/3}
  .catcard .body{padding:10px 10px 12px;gap:4px;border-top-width:3px}
  .catcard h3{font-size:.95rem}
  .catcard .meta{flex-direction:column;gap:2px;font-size:.78rem}
  .catcard .go{display:none}
}
@media (max-width:480px){
  .row2{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .brand span{display:none}
  .prow{grid-template-columns:52px minmax(0,1fr)}
  .prow .acts{grid-column:1/-1;justify-content:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="demo" id="demo"></div>
<header class="top">

/* ---------- state + storage ---------- */
const KEY='styler_mvp_v2';
const mem={};
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return mem[k]||null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){mem[k]=v;return false}}
let S=lsGet(KEY);
if(!S||!S.products||!S.categories){S={lang:'ar',categories:seedCats(),products:seedProducts(),orders:seedOrders(),settings:seedSettings(),cart:[]};}
function save(){if(!lsSet(KEY,S)&&S._warned!==true){toast(t('storeFull'));}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function t(k){return (T[S.lang]&&T[S.lang][k])||T.ar[k]||k}
function L(o){return o?(o[S.lang]||o.ar||''):''}
function bi(s){if(!s)return '';const p=String(s).split(' / ');return S.lang==='en'&&p[1]?p[1]:p[0]}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(n){return Number.isInteger(n)?String(n):Number(n).toFixed(2).replace(/\.?0+$/,'')}
function fmt(n){return S.lang==='ar'?num(n)+' د.أ':'JD '+num(n)}
function prod(id){return S.products.find(p=>p.id===id)}
function cat(id){return S.categories.find(c=>c.id===id)}
function gov(id){return GOVS.find(g=>g.id===id)}
function tierLabel(tr){if(!tr)return '';const unit=tr.q===1?t('piece'):t('pcs');const note=S.lang==='en'?(tr.nEn||tr.nAr):tr.nAr;
  return (tr.q===1&&note?note:(tr.q+' '+unit+(note?' · '+note:'')))}
function minPrice(p){return p.tiers.length?Math.min(...p.tiers.map(x=>x.p)):0}
function fmtDate(iso){try{return new Date(iso).toLocaleString(S.lang==='ar'?'ar-JO':'en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return iso}}
function toIntl(phone){const d=String(phone).replace(/\D/g,'');return d.startsWith('0')?'962'+d.slice(1):d}
function waLink(num,text){return 'https://wa.me/'+toIntl(num)+'?text='+encodeURIComponent(text)}
let toastT;function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200)}
function unitPrice(item){const p=prod(item.productId);if(item.quotedPrice!=null&&item.quotedPrice!=='')return Number(item.quotedPrice);
  if(p&&p.mode==='fixed'&&item.tier!=null&&p.tiers[item.tier])return p.tiers[item.tier].p;return null}
function totals(items,govId){
  let sub=0,pending=0;items.forEach(i=>{const u=unitPrice(i);if(u==null)pending++;else sub+=u*(i.count||1)});
  const free=items.some(i=>{const p=prod(i.productId);return p&&p.freeDelivery});
  const g=gov(govId);const del=!govId?null:(free?0:(g&&g.zone==='A'?Number(S.settings.feeA):Number(S.settings.feeB)));
  return {sub,pending,free,del,total:sub+(del||0)};
}
function itemDesc(i){const p=prod(i.productId);const parts=[];
  if(p&&i.tier!=null&&p.tiers[i.tier])parts.push(tierLabel(p.tiers[i.tier]));
  if(i.qtyApprox)parts.push(t('quoteQty')+': '+i.qtyApprox);
  if(i.color)parts.push(t('colorLbl')+': '+bi(i.color));if(i.notes)parts.push(i.notes);return parts}

/* image file -> compressed data URL */
function readImage(file,max,cb){
  if(!file)return cb(null);
  if(!/^image\//.test(file.type)){return cb({name:file.name,thumb:''})}
  const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
    const s=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');
    cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
    cx.drawImage(img,0,0,cv.width,cv.height);cb({name:file.name,thumb:cv.toDataURL('image/jpeg',.8)})};img.onerror=()=>cb({name:file.name,thumb:''});img.src=fr.result};
  fr.readAsDataURL(file);
}

  <div class="muted small">${t('freeDelRule')}</div>
  <h2 style="margin-top:8px">${t('socialLinks')}</h2>
  <div class="field"><label for="s-wa">${t('waNum')}</label><input type="text" id="s-wa" dir="ltr" value="${esc(S.settings.whatsapp)}"></div>
  <div class="field"><label for="s-ig">${t('igUrl')}</label><input type="text" id="s-ig" dir="ltr" value="${esc(S.settings.instagram||'')}"></div>
  <div class="field"><label for="s-fb">${t('fbUrl')}</label><input type="text" id="s-fb" dir="ltr" value="${esc(S.settings.facebook||'')}"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between"><button class="btn primary" type="submit">${t('save')}</button><button type="button" class="btn danger" id="s-reset">${t('reset')}</button></div>
  </form></div>`;
}

/* ---------- modal ---------- */
function openModal(html){$('#modal-root').innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="box">${html}</div></div>`;
  const m=$('#modal-root .modal');m.onclick=e=>{if(e.target===m||e.target.hasAttribute('data-close'))closeModal()};
  const f=m.querySelector('input,select,textarea,button');if(f)f.focus()}
function closeModal(){$('#modal-root').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ---------- bindings ---------- */
function bind(h){
  if($('#side')){
    refreshList();
    document.querySelectorAll('[name="fcat"]').forEach(r=>r.onchange=()=>{location.hash=r.value==='all'?'products':'c-'+r.value});
    $('#q').oninput=e=>{filter.q=e.target.value;refreshList()};
    const num=v=>v.trim()===''?'':String(Math.max(0,Number(v)||0));
    $('#fmin').oninput=e=>{filter.min=num(e.target.value);refreshList()};
    $('#fmax').oninput=e=>{filter.max=num(e.target.value);refreshList()};
    document.querySelectorAll('[name="ftype"]').forEach(r=>r.onchange=()=>{filter.type=r.value;refreshList()});
    $('#ffr').onchange=e=>{filter.free=e.target.checked;refreshList()};
    $('#fsort').onchange=e=>{filter.sort=e.target.value;refreshList()};
    $('#fclear').onclick=()=>{const c=filter.cat;filter=Object.assign({},FILTER0,{cat:c});syncSide();refreshList()};
    $('#ftoggle').onclick=e=>{const s=$('#side');const o=s.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',o)};
  }
  if($('#pform'))bindProduct(prod(h.slice(2)));
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{S.cart.splice(+b.dataset.rm,1);save();render()});
  document.querySelectorAll('[data-cstep]').forEach(b=>b.onclick=()=>{const i=S.cart[+b.dataset.ix];i.count=Math.max(1,(i.count||1)+ +b.dataset.cstep);save();render()});
  if($('#cform'))bindCheckout();
  bindOrderRows();
  if($('#oq'))$('#oq').oninput=e=>{oq=e.target.value;$('#orows').innerHTML=ordersRows(ordersList());bindOrderRows()};
  if($('#padd'))$('#padd').onclick=()=>productModal(null);
  if($('#cadd'))$('#cadd').onclick=()=>catModal(null);
  document.querySelectorAll('[data-cedit]').forEach(b=>b.onclick=()=>catModal(b.dataset.cedit));
  document.querySelectorAll('[data-pedit]').forEach(b=>b.onclick=()=>productModal(b.dataset.pedit));
  document.querySelectorAll('[data-ptog]').forEach(b=>b.onclick=()=>{const p=prod(b.dataset.ptog);p.active=!p.active;save();render()});
  if($('#sform')){
    $('#sform').onsubmit=e=>{e.preventDefault();S.settings.feeA=Number($('#s-a').value)||0;S.settings.feeB=Number($('#s-b').value)||0;S.settings.whatsapp=$('#s-wa').value.replace(/\D/g,'')||S.settings.whatsapp;S.settings.instagram=$('#s-ig').value.trim();S.settings.facebook=$('#s-fb').value.trim();save();toast(t('saved'));renderNav(true)};
    let armed=false;$('#s-reset').onclick=e=>{if(!armed){armed=true;e.target.textContent=t('resetConfirm');return}
      S.categories=seedCats();S.products=seedProducts();S.orders=seedOrders();S.settings=seedSettings();S.cart=[];save();toast(t('resetDone'));render()};
  }
}
function bindProduct(p){
  document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{const c=$('#count');c.value=Math.max(1,(+c.value||1)+ +b.dataset.step)});
  $('#pform').onsubmit=e=>{e.preventDefault();
    const fixed=p.mode==='fixed'&&p.tiers.length;
    const val=n=>{const el=document.querySelector(`[name="${n}"]:checked`);return el?el.value:''};
    S.cart.push({productId:p.id,tier:fixed?Number(val('tier')):null,count:fixed?Math.max(1,+$('#count').value||1):1,
      color:val('color'),quotedPrice:null,qtyApprox:$('#qqty')?$('#qqty').value.trim():''});
    save();toast(t('added'));renderNav(false);
    e.target.reset();
  };
}
function bindCheckout(){
  $('#cgov').onchange=()=>{$('#csum').innerHTML=sumHtml($('#cgov').value)};
  $('#cform').onsubmit=e=>{e.preventDefault();
    const name=$('#cname').value.trim(),phone=$('#cphone').value.replace(/[\s-]/g,''),g=$('#cgov').value,addr=$('#caddr').value.trim();
    const bad={name:!name,phone:!/^07[789]\d{7}$/.test(phone),gov:!g,addr:!addr};
    Object.entries(bad).forEach(([k,v])=>{document.querySelector(`[data-e="${k}"]`).hidden=!v});
    const first=Object.keys(bad).find(k=>bad[k]);if(first){({name:$('#cname'),phone:$('#cphone'),gov:$('#cgov'),addr:$('#caddr')})[first].focus();return}
    const id=String(S.settings.nextId++);
    const o={id,createdAt:new Date().toISOString(),
      customer:{name,phone,gov:g,address:addr},items:S.cart.map(i=>Object.assign({},i)),adminNote:''};
    S.orders.push(o);S.cart=[];save();
    try{window.open(waLink(S.settings.whatsapp,orderText(o)),'_blank','noopener')}catch(err){}
    location.hash='done-'+id;
  };
}

window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
