# Alembic config. The database URL is not here: env.py reads DATABASE_URL
# from the environment through app.core.config.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# Files are named <rev>_<slug>.py; pass a sequential id: --rev-id 0009
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
path_separator = os

[post_write_hooks]
# Format and lint every generated migration, so the draft is clean before review.
hooks = ruff_format, ruff_fix
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
