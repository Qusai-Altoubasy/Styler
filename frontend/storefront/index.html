<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16171b" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Styler Printing Press: DTF, UV, stickers, labels, paper prints, laser and banners, delivered across Jordan."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Styler Printing Press</title>
    <script>
      // Before the first paint: language direction and theme, so nothing flashes.
      (function () {
        var d = document.documentElement;
        var lang = localStorage.getItem("styler.lang") === "en" ? "en" : "ar";
        d.lang = lang;
        d.dir = lang === "ar" ? "rtl" : "ltr";
        var t = localStorage.getItem("styler.theme");
        if (t !== "light" && t !== "dark")
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        d.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
