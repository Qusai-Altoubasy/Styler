# Local development: PostgreSQL, MinIO (S3 for images) and FastAPI with auto-reload.
# From the repository root:
#   docker compose --env-file deploy/.env.dev -f deploy/compose.dev.yaml up --build
# The production compose file (compose.prod.yaml) is added here in phase 6.
#
# No values live in this file: every setting comes from deploy/.env.dev
# (not committed; copy it from deploy/.env.dev.example).
#
# The network and the database volume are external: they are created once by hand
# on each machine (see deploy/README.md) and compose never creates or deletes them,
# so `docker compose down -v` cannot wipe the database by accident.

name: styler

services:
  db:
    # Pinned so local and server run the same PostgreSQL. Alpine is ~240 MB smaller;
    # collation is safe because the database uses PostgreSQL's builtin locale provider
    # (POSTGRES_INITDB_ARGS in the env file), not the OS's.
    image: postgres:18.7-alpine3.24
    container_name: styler-db
    env_file: .env.dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - styler-db-data:/var/lib/postgresql
    networks:
      - styler-net
    healthcheck:
      # $$ escapes compose interpolation, so the variables are read inside the container.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # S3-compatible storage standing in for the images bucket. The official MinIO image
    # is no longer published, so this is Chainguard's build of the upstream MinIO source,
    # pinned by digest (MinIO RELEASE.2026-11-12T01-15-23Z). Bump on purpose, in a commit.
    image: cgr.dev/chainguard/minio@sha256:18c8fa28697b25e0f34c6faae171079e88a03efb8e76a21d3b5d07b4e3cbef3e
    container_name: styler-minio
    # MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, MINIO_SITE_REGION and MINIO_API_CORS_ALLOW_ORIGIN.
    env_file: .env.dev
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000" # S3 API: the browser uploads here (S3_PUBLIC_ENDPOINT_URL)
      - "127.0.0.1:9001:9001" # web console
    volumes:
      - styler-minio-data:/data
    networks:
      - styler-net

  storage-init:
    # One-shot: creates the bucket, the tmp/ one-day lifecycle and public read on media/.
    # Safe to run on every `up`. Reuses the API image (built by the api service) for boto3.
    image: styler-api:dev
    pull_policy: never
    container_name: styler-storage-init
    env_file: .env.dev
    command: ["python", "/init/init_dev_storage.py"]
    volumes:
      - ./init_dev_storage.py:/init/init_dev_storage.py:ro
    networks:
      - styler-net
    user: "${HOST_UID:?set HOST_UID in deploy/.env.dev}:${HOST_GID:?set HOST_GID in deploy/.env.dev}"
    depends_on:
      minio:
        condition: service_started

  api:
    image: styler-api:dev
    container_name: styler-api
    build:
      context: ../backend
      target: dev
    # DATABASE_URL points at "db", the service name, resolved by Docker DNS on styler-net.
    env_file: .env.dev
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../backend:/app
    networks:
      - styler-net
    # Run as the host user so files written into the mounted folder stay yours.
    # Interpolated from deploy/.env.dev, passed with --env-file.
    user: "${HOST_UID:?set HOST_UID in deploy/.env.dev}:${HOST_GID:?set HOST_GID in deploy/.env.dev}"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

networks:
  styler-net:
    external: true

volumes:
  styler-db-data:
    external: true
  # Local images only (production uses S3), so a normal volume managed by compose:
  # `docker compose down -v` deletes it, and storage-init recreates the bucket.
  styler-minio-data:
    name: styler-minio-data
